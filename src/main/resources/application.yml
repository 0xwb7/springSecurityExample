spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    open-in-view: false

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${ACCESS_EXP}
  refresh-token-expiration: ${REFRESH_EXP}
